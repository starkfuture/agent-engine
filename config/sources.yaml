# What the patrol reads. Everything is a read-only query through the Grafana
# datasource proxy. Labels marked UNVERIFIED must be checked with
# `npm run dev -- doctor` (VPN on) before the replay can be trusted.

http_families:
  # The V3 services: one metric name per service, all carrying the same labels.
  - id: v3
    selector: '{__name__=~"[a-z_]+_svc_http_requests_total"}'
    service_label: app
    route_label: route
    status_label: status_code
    latency_buckets: '{__name__=~"[a-z_]+_svc_http_request_duration_seconds_bucket"}'

  # Legacy /v1 backend. The 29-30 Sep sign-up/reset 400s live on this series.
  - id: legacy-v1
    selector: 'backend_be_production_http_requests_total'
    service: backend-production
    route_label: route         # UNVERIFIED
    status_label: status_code  # UNVERIFIED
    latency_buckets: backend_be_production_http_request_duration_seconds_bucket

  - id: keycloak
    selector: 'http_server_requests_seconds_count{job="keycloak-production",uri!~"/auth/health.*|/auth/metrics"}'
    service: keycloak
    route_label: uri
    status_label: status

  # Mesh view of the legacy backend: no route, but it does not depend on app code.
  - id: legacy-mesh
    selector: 'istio_requests_total{destination_workload="backend-production",reporter="waypoint"}'
    service: backend-production-mesh
    status_label: response_code

# Counters where any increase is bad, compared against the same baselines.
error_counters:
  - id: sqs-consumer-errors
    selector: '{__name__=~".+_sqs_message_errors_total"}'
    group_by: [app, queue, error_type] # verified against live series 2026-11-02

# Sustained measurements, not event-count anomalies. Operational thresholds
# are initial reviewable policy, not customer SLOs or learned p99 baselines.
# Metric presence/labels checked read-only through Grafana on 2026-11-02.
# Node churn can leave partial histories; report the coverage gap explicitly.
gauges:
  - id: node-not-ready
    query: 'max by (node) (kube_node_status_condition{condition="Ready",status=~"false|unknown"})'
    group_by: [node]
    unit: unhealthy
    direction: above
    warning: 1
    critical: 1
    for_minutes: 5
  - id: node-cpu
    query: '100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))'
    group_by: [instance]
    unit: percent
    direction: above
    warning: 90
    for_minutes: 15
  - id: node-memory
    query: 'max by (instance) (100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))'
    group_by: [instance]
    unit: percent
    direction: above
    warning: 90
    for_minutes: 15
  - id: database-unavailable
    query: 'min by (cluster) (pg_up{namespace="microservices"})'
    group_by: [cluster]
    unit: available
    direction: below
    warning: 0
    critical: 0
    for_minutes: 5
  - id: database-pool-waiting
    query: 'max by (app) (pg_pool_waiting{namespace="microservices"})'
    group_by: [app]
    unit: waiting-connections
    direction: above
    warning: 1
    for_minutes: 5
  - id: statefulset-unavailable
    query: 'max by (namespace,statefulset) (kube_statefulset_replicas{namespace=~"microservices|backend.*"} - kube_statefulset_status_replicas_ready{namespace=~"microservices|backend.*"})'
    group_by: [namespace, statefulset]
    service_label: statefulset
    unit: unavailable-replicas
    direction: above
    warning: 1
    critical: 1
    for_minutes: 10
  - id: scrape-down
    query: 'min by (job,instance) (up{job=~"backend-microservices|keycloak-production|node-exporter|kube-state-metrics"})'
    group_by: [job, instance]
    unit: available
    direction: below
    warning: 0
    for_minutes: 5

# Existing warning/critical rules may start an investigation; info is context
# only. Their severity cannot independently create a new urgent Slack page.
alerts:
  namespaces: 'microservices|backend.*'
  health_selector: 'up{job="kube-prometheus-stack-prometheus"} == 1'

workloads:
  namespaces: 'microservices|backend.*'

logs:
  selector: '{namespace="microservices"}'
  # The cheap case-insensitive filter first: the precise regex alone over every
  # microservices line took over 30 s (the query timeout) for about half the
  # patrols; behind the prefilter it takes ~5 s and matches the same lines.
  error_filter: '|~ "(?i)(error|fatal)" |~ `(?i)(level"?\s*[:=]\s*"?(error|fatal)|\b(ERROR|FATAL)\b)`'
  service_label: app
  max_lines: 3000

traces:
  traceql: '{ status = error }'
  limit: 300
