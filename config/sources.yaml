# What the patrol reads. Everything is a read-only query through the Grafana
# datasource proxy. Labels marked UNVERIFIED must be checked with
# `npm run dev -- doctor` (VPN on) before the replay can be trusted.

http_families:
  # The V3 services: one metric name per service, all carrying the same labels.
  - id: v3
    selector: '{__name__=~"[a-z_]+_svc_http_requests_total"}'
    service_label: app
    route_label: route
    status_label: status_code

  # Legacy /v1 backend. The 29-30 Sep sign-up/reset 400s live on this series.
  - id: legacy-v1
    selector: 'backend_be_production_http_requests_total'
    service: backend-production
    route_label: route         # UNVERIFIED
    status_label: status_code  # UNVERIFIED

  - id: keycloak
    selector: 'http_server_requests_seconds_count{job="keycloak-production",uri!~"/auth/health.*|/auth/metrics"}'
    service: keycloak
    route_label: uri
    status_label: status

  # Mesh view of the legacy backend: no route, but it does not depend on app code.
  - id: legacy-mesh
    selector: 'istio_requests_total{destination_workload="backend-production",reporter="waypoint"}'
    service: backend-production-mesh
    status_label: response_code

# Counters where any increase is bad, compared against the same baselines.
error_counters:
  # Every service's consumer errors (erp-broker's are erp_broker_svc_…).
  - id: sqs-consumer-errors
    selector: '{__name__=~".+_sqs_message_errors_total"}'
    group_by: [app, queue, error_type] # verified against live series 2026-11-02
    # No errors is also what a stopped scrape looks like: the services must be up.
    presence: 'up{job="backend-microservices"} == 1' # job seen on microservices targets 2026-11-02; doctor shows the count

workloads:
  namespaces: 'microservices|backend.*'

# Deploys are new ReplicaSets in those namespaces (kube-state-metrics). Scaling
# is not a deploy: it bumps the generation but creates no ReplicaSet.
deploys:
  # Row service -> Deployment where the names differ.
  aliases:
    keycloak: keycloak-production
    backend-production-mesh: backend-production
  # A starting value: set it from measured rollout durations.
  stall_minutes: 10
  # Argo CD app metrics, scraped since argo-cd #1314 (labels verified 2026-11-03).
  # Off: nothing is read and no blind spot is reported.
  argocd: true

logs:
  selector: '{namespace="microservices"}'
  # The cheap case-insensitive filter first: the precise regex alone over every
  # microservices line took over 30 s (the query timeout) for about half the
  # patrols; behind the prefilter it takes ~5 s and matches the same lines.
  error_filter: '|~ "(?i)(error|fatal)" |~ `(?i)(level"?\s*[:=]\s*"?(error|fatal)|\b(ERROR|FATAL)\b)`'
  service_label: app
  max_lines: 3000

traces:
  traceql: '{ status = error }'
  limit: 300
